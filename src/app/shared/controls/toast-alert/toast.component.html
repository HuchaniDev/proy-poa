@if (isVisible()) {
  <div class="fixed top-16 right-1 max-w-sm w-full rounded-l-lg shadow-gray-600 shadow-lg bg-white select-none toast">

    @if (type()==='success') {
      <div class="flex justify-center items-center gap-3 border-l-[5px] rounded-l-lg border-[#4CAF50] bg-[#4CAF50] bg-opacity-15 p-2 ">

        <div class="flex justify-center items-center border-2 border-[#4CAF50] rounded-full p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>          
        </div>

        <div class="flex-grow ">
          <h2 class="text-lg font-semibold text-[#4CAF50]">Exito</h2>
          <p class="text-gray-700">{{message()}}</p>
        </div>

        <div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 cursor-pointer text-gray-500 hover:text-gray-700"
          (click)="closeToast()">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>

      </div>
    }
    @if (type()==='error') {
      <div class="flex justify-center items-center gap-3 border-l-[5px] rounded-l-lg border-[#F44336] bg-[#F44336] bg-opacity-15 p-2 ">

        <div class="flex justify-center items-center border-2 border-[#F44336] rounded-full p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>                   
        </div>

        <div class="flex-grow ">
          <h2 class="text-lg font-semibold text-[#F44336]">Error</h2>
          <p class="text-gray-700">{{message()}}</p>
        </div>

        <div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 cursor-pointer text-gray-500 hover:text-gray-700"
          (click)="closeToast()">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>

      </div>
    }
    @if (type()==='info') {
      <div class="flex justify-center items-center gap-3 border-l-[5px] rounded-l-lg border-[#2196F3] bg-[#2196F3] bg-opacity-15 p-2 ">

        <div class="flex justify-center items-center border-2 border-[#2196F3] rounded-full p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>                           
        </div>

        <div class="flex-grow ">
          <h2 class="text-lg font-semibold text-[#2196F3]">Información</h2>
          <p class="text-gray-700">{{message()}}</p>
        </div>

        <div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 cursor-pointer text-gray-500 hover:text-gray-700"
          (click)="closeToast()">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>

      </div>
    }


    @if (type()==='delete') {
      <div class="flex justify-center items-center gap-3 border-l-[5px] rounded-l-lg border-[#FF9800] bg-[#FF9800] bg-opacity-15 p-2 ">

        <div class="flex justify-center items-center border-2 border-[#FF9800] rounded-full p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>                            
        </div>

        <div class="flex-grow ">
          <h2 class="text-lg font-semibold text-[#FF9800]">Eliminado</h2>
          <p class="text-gray-700">{{message()}}</p>
        </div>

        <div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 cursor-pointer text-gray-500 hover:text-gray-700"
          (click)="closeToast()">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>

      </div>
    }
    @if (type()==='update') {
      <div class="flex justify-center items-center gap-3 border-l-[5px] rounded-l-lg border-[#8BC34A] bg-[#8BC34A] bg-opacity-15 p-2 ">

        <div class="flex justify-center items-center border-2 border-[#8BC34A] rounded-full p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>                           
        </div>

        <div class="flex-grow ">
          <h2 class="text-lg font-semibold text-[#8BC34A]">Actualizado</h2>
          <p class="text-gray-700">{{message()}}</p>
        </div>

        <div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 cursor-pointer text-gray-500 hover:text-gray-700"
          (click)="closeToast()">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>

      </div>
    }
    
  </div>
  

}
