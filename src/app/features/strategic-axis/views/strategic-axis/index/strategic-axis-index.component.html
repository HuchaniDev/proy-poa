<div>
  <page-header title="Gestion Eje Estratégico" description=""></page-header>
  <div class="px-2 py-5">
    <div class="flex justify-between">
      <div class="flex w-[500px] gap-2">
        <input type="text" [(ngModel)]="textSearch" class="" app-input  placeholder="Buscar por codigo" />
        
        <div class="flex items-center border-primary border-2 rounded-full px-2 hover:bg-primary hover:text-white cursor-pointer"
          (click)="searchByDescription()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </div>
      </div>
      <button
        class="pr-5 flex items-center gap-2 border-primary border-2 rounded-md px-2 bg-primary hover:shadow-sm hover:border-yellow-600 hover:shadow-yellow-400 text-white cursor-pointer"
        (click)="openForm()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Nuevo
      </button>
        
    </div>

    <div class="mt-10">
      <table class="table border-separate w-full">
        <thead>
          <tr class="bg-primary text-gray-900 [&>th:first-child]:rounded-tl-lg [&>th:last-child]:rounded-tr-lg [&>th]:px-3 [&>th]:select-none [&>th]:py-1 [&>th]:cursor-pointer
            [&>th]:font-normal">
            <th class="w-56">CODIGO</th>
            <th class="min-w-80 w-96">DESCRIPCION</th>
            <th class="w-72">LINEA ESTRATEGICA</th>
            <th class="w-40">ACCIONES</th>
          </tr>
        </thead>
        <tbody>
          @if(strategicAxisList.length === 0) {
            <tr>
              <td colspan="4" class="text-center">No hay registros</td>
            </tr>
          }
          @for (axis of strategicAxisList; track $index) {
            <tr class="{{ $index % 2 === 0 ? 'bg-gray-100' : 'bg-gray-200' }}">
              <td class="p-2 text-center">{{axis.code}}</td>
              <td class="p-2">{{axis.description}}</td>
              <td class="p-2">
                <div class="flex justify-center items-center h-7 p-2">
                  <button class="w-28 p-1  bg-green-300 rounded-2xl hover:bg-green-600 hover:text-white">ver lineas</button>
                </div>
              </td>
              <td class="flex justify-center gap-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 hover:cursor-pointer hover:text-primary"
                (click)="edit(axis.id)">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 hover:cursor-pointer hover:text-red-500"
                  (click)="delete(axis.id)">
                
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>                
              </td>
            </tr>
          }
      </table>
      
    </div>  
  </div>
</div>
