<div class="flex flex-col select-none">
  <dialog-header [titleHeader]="(strategicAxisId? 'Editar': 'Nueva')+': Linea Estrategica'"
    (onClose)="close()"
  ></dialog-header>

  <form [formGroup]="formGroup" class="">
    
    <div class="p-4 flex flex-col gap-5">
      <div class="w-48">
        <label for="">codigo</label>
        <input
          formControlName="code"
          type="text" app-input useIcon="false" class="w-full p-2 border border-gray-300 rounded-lg" placeholder=" ej: 3487234">
          
          @if (formGroup.get('code')?.hasError('required') && formGroup.get('code')?.touched) {
            <div class="text-red-500 text-sm">Este campo es requerido</div>
          }
      </div>
      <div id="description" class="h-56">
        <label for="">Descripcion</label>
        <textarea 
          formControlName="description"
          app-input
          class="w-full h-40 p-2 border resize-none border-gray-300 rounded-lg "
          placeholder="Escribe aquí...">
        </textarea>
        @if (formGroup.get('description')?.hasError('required') && formGroup.get('description')?.touched) {
          <div class="text-red-500 text-sm">Este campo es requerido</div>
        }
       
      </div>
      
      <div class="flex justify-end gap-5" >
          <button class="flex items-center gap-2 border border-gray-300 hover:border-yellow-200 rounded-lg py-2 px-5"
            (click)="close()"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>        
            Cancelar
          </button>
          
          <button class="flex items-center gap-2 border border-primary hover:bg-primary rounded-lg py-2 px-5 disabled:opacity-50"
            [disabled]="formGroup.invalid || isProcessing"
            (click)="save()"
            >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3m3 3a3 3 0 1 0 0 6h13.5a3 3 0 1 0 0-6m-16.5-3a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3m-19.5 0a4.5 4.5 0 0 1 .9-2.7L5.737 5.1a3.375 3.375 0 0 1 2.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 0 1 .9 2.7m0 0a3 3 0 0 1-3 3m0 3h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Zm-3 6h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Z" />
            </svg>
            Guardar
          </button>
        
      </div>
    </div>
  </form>
</div>
