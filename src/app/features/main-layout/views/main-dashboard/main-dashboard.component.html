<div class="bg-red-100 w-full h-full p-5">
  <div class="w-full">
    <h2 class="text-2xl text-primary-dark font-semibold">Menu Principal</h2>
    <span>Inicio</span>
    <hr class="bg-primary-dark h-1 w-full mt-2">
  </div>
  <div class="flex justify-center items-center">

    <div class="grid grid-cols-2 justify-center items-center gap-14 mt-4">
      @for (feature of features; track $index) {
        @if (permissionService.hasAnyRole(feature.roles)) {

          <div class="bg-primary w-80 h-32 rounded-lg flex justify-center items-center text-white hover:bg-primary-dark cursor-pointer hover:shadow-md hover:shadow-yellow-300 transition duration-300 ease-in-out">
            <div></div>
            <div>
              <h3 class="font-semibold text-xl">{{feature.name}}</h3>
            </div>
          </div>
        }
      }
    </div>
  </div>
    
</div>
